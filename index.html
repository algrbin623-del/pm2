<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/13.0.0/firebase-app.js";
  import { getMessaging, getToken, onMessage } from "https://www.gstatic.com/firebasejs/13.0.0/firebase-messaging.js";

  const firebaseConfig = {
    apiKey: "AIzaSyDtFwMuF8sW5Pkqkgu010oHqsA7ffrnXMM",
    authDomain: "pm2-app-c29fa.firebaseapp.com",
    projectId: "pm2-app-c29fa",
    storageBucket: "pm2-app-c29fa.firebasestorage.app",
    messagingSenderId: "576395459652",
    appId: "1:576395459652:web:65caa9ef7a2692183f9011",
    measurementId: "G-Z8EY44VM2D"
  };

  const app = initializeApp(firebaseConfig);
  const messaging = getMessaging(app);

  async function registerNotificationSystem() {
    if ('serviceWorker' in navigator && 'Notification' in window) {
      try {
        // تسجيل الـ Service Worker
        const registration = await navigator.serviceWorker.register('/pm2/firebase-messaging-sw.js');
        
        // طلب إذن الإشعارات من المستخدم
        const permission = await Notification.requestPermission();
        if (permission === 'granted') {
          // استخراج رمز الجهاز (Device Token)
          const currentToken = await getToken(messaging, {
            vapidKey: 'BBxT4h0MXr2gO_ULuUpBAnuHcW6iDXjwYIeZ2oBZUWhyD3tlUpo2BPJaK8_4STIj1Q4d8fPIp5xmPY9OKJ0MVoE',
            serviceWorkerRegistration: registration
          });

          if (currentToken) {
            console.log('FCM Token:', currentToken);
          } else {
            console.warn('لم يتم الحصول على Token.');
          }
        }
      } catch (err) {
        console.error('خطأ في إعداد الإشعارات:', err);
      }
    }
  }

  // استقبال الإشعارات والتطبيق مفتوح في الواجهة (Foreground)
  onMessage(messaging, (payload) => {
    console.log('تم استقبال إشعار أثناء فتح التطبيق:', payload);
    new Notification(payload.notification.title || 'تنبيه', {
      body: payload.notification.body || '',
      icon: '/pm2/icon.png'
    });
  });

  registerNotificationSystem();
</script>
